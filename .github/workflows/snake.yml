name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2c5364&color_dots=#ebedf0,#b7d4e3,#7fb2cc,#3a9bc9,#2c5364
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3a9bc9&color_dots=#161b22,#16354a,#1f5a7a,#2f86b0,#3a9bc9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
